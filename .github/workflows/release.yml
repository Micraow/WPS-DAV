name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_aur:
        description: "Publish an existing release to AUR (version, e.g. 0.1.3)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: darwin
            goarch: arm64
            archive: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi

          BIN=wpsdav
          if [ "$GOOS" = "windows" ]; then
            BIN=wpsdav.exe
          fi

          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${BIN}" .

          cp README.md LICENSE config.example.json dist/
          cp packaging/systemd/wpsdav.service dist/
          cd dist

          NAME="wpsdav_${VERSION}_${GOOS}_${GOARCH}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -rq "../${NAME}.zip" .
          else
            tar -czf "../${NAME}.tar.gz" .
          fi
          echo "built ${NAME}.${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpsdav-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            wpsdav_*.tar.gz
            wpsdav_*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum *.tar.gz *.zip > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums-sha256.txt

  aur:
    name: Publish to AUR
    needs: [build, release]
    if: |
      (startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && needs.release.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_aur != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and checksum
        env:
          INPUT_VERSION: ${{ github.event.inputs.publish_aur }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [ -n "${VERSION}" ] || { echo "no version resolved"; exit 1; }

          URL="https://github.com/Micraow/WPS-DAV/releases/download/v${VERSION}/checksums-sha256.txt"
          SUM="$(curl -fsSL "${URL}" | awk -v n="wpsdav_${VERSION}_linux_amd64.tar.gz" '$2 == n { print $1 }')"
          [ -n "${SUM}" ] || { echo "checksum for v${VERSION} not found in ${URL}"; exit 1; }

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "SUM=${SUM}" >> "${GITHUB_ENV}"
          echo "publishing wpsdav-bin ${VERSION} (${SUM})"

      - name: Update AUR metadata
        run: |
          set -euo pipefail
          PKG=packaging/aur/wpsdav-bin/PKGBUILD
          SRC=packaging/aur/wpsdav-bin/.SRCINFO

          sed -i -E "s/^pkgver=.*/pkgver=${VERSION}/" "${PKG}"
          sed -i -E "s/^sha256sums=\('.*'\)/sha256sums=('${SUM}')/" "${PKG}"
          sed -i -E "s/^\tpkgver = .*/\tpkgver = ${VERSION}/" "${SRC}"
          sed -i -E "s#^\tsource = .*#\tsource = wpsdav-${VERSION}.tar.gz::https://github.com/Micraow/WPS-DAV/releases/download/v${VERSION}/wpsdav_${VERSION}_linux_amd64.tar.gz#" "${SRC}"
          sed -i -E "s/^\tsha256sums = .*/\tsha256sums = ${SUM}/" "${SRC}"

          grep -E '^pkgver|^sha256sums' "${PKG}"
          grep -E 'pkgver|source|sha256sums' "${SRC}"

      - name: Set up AUR SSH key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${AUR_SSH_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push to AUR
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          rm -rf /tmp/aur
          git clone ssh://aur@aur.archlinux.org/wpsdav-bin.git /tmp/aur
          cp packaging/aur/wpsdav-bin/PKGBUILD packaging/aur/wpsdav-bin/.SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.name "wpsdav release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR already up to date"
            exit 0
          fi
          git commit -m "wpsdav-bin ${VERSION}"
          git push origin master

      - name: Sync AUR metadata to main
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "wpsdav release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git checkout -- packaging/aur/wpsdav-bin/ || true
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/aur/PKGBUILD /tmp/aur/.SRCINFO packaging/aur/wpsdav-bin/
          git add packaging/aur/wpsdav-bin/PKGBUILD packaging/aur/wpsdav-bin/.SRCINFO
          if git diff --cached --quiet; then
            echo "main already up to date"
            exit 0
          fi
          git commit -m "aur: wpsdav-bin ${VERSION}"
          git push origin main
